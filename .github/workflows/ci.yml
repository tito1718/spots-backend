name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NODE_ENV: test
      PORT: 3002
      DATABASE_URL: mongodb://127.0.0.1:27017/spots_test
      ACCESS_TOKEN_SECRET: ci_access_token_secret_that_is_long_and_not_used_in_production
      REFRESH_TOKEN_SECRET: ci_refresh_token_secret_that_is_long_and_not_used_in_production
      CLIENT_ORIGINS: http://localhost:5173

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
